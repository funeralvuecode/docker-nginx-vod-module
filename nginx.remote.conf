worker_processes  auto;

events {
	use epoll;
}

http {
	log_format  main  '$remote_addr $remote_user [$time_local] "$request" '
		'$status "$http_referer" "$http_user_agent"';

	access_log  /dev/stdout  main;
	error_log   stderr debug;

	default_type  application/octet-stream;
	include       /usr/local/nginx/conf/mime.types;

	# tcp_nopush  on;
	tcp_nodelay on;


	open_file_cache          max=1000 inactive=5m;
	open_file_cache_valid    2m;
	open_file_cache_min_uses 1;
	open_file_cache_errors   on;

	aio on;


	server {
		listen ${PORT};
		server_name localhost;

		vod_mode remote;
		vod_upstream_location /remote;

		vod_metadata_cache                 metadata_cache 2048m;
		vod_response_cache response_cache  128m;
		vod_last_modified_types            *;
		vod_segment_duration               9000;
		vod_align_segments_to_key_frames   on;
		vod_dash_fragment_file_name_prefix "segment";
		vod_hls_segment_file_name_prefix   "segment";

		vod_dash_absolute_manifest_urls    off;
		vod_hls_absolute_master_urls       off;
		vod_hls_absolute_index_urls       off;

		vod_manifest_segment_durations_mode accurate;

		aws_access_key ${AWS_ACCESS_KEY};
		aws_secret_key ${AWS_SECRET_KEY};
		aws_region ${AWS_REGION};
		aws_s3_bucket ${AWS_S3_BUCKET};

		# Re-resolve S3 regularly instead of once at startup. S3 rotates its IPs
		# (TTL ~3s); a static proxy_pass pins the startup IPs forever, and when one
		# is retired ~1 in 8 fetches hangs (prod incident 2026-10-13).
		# 169.254.169.253 is the Amazon VPC DNS resolver.
		resolver         169.254.169.253 valid=10s ipv6=off;
		resolver_timeout 2s;

		# Fail fast on a dead S3 IP and retry the request on another one.
		proxy_connect_timeout     2s;
		proxy_next_upstream       error timeout;
		proxy_next_upstream_tries 3;


		location ^~ /remote/dash/ {
			aws_sign;
			internal;
			# A variable in proxy_pass makes nginx resolve the host at request time.
			# Must be set before the rewrite: "break" stops further rewrite-module directives.
			set $s3_host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			rewrite ^/remote/dash/(.*) /$1 break;
			proxy_pass http://$s3_host;
			proxy_set_header Host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			proxy_set_header x-amz-cf-id ""; # https://github.com/anomalizer/ngx_aws_auth/issues/6
		}

		location ^~ /remote/hls/ {
			aws_sign;
			internal;
			# A variable in proxy_pass makes nginx resolve the host at request time.
			# Must be set before the rewrite: "break" stops further rewrite-module directives.
			set $s3_host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			rewrite ^/remote/hls/(.*) /$1 break;
			proxy_pass http://$s3_host;
			proxy_set_header Host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			proxy_set_header x-amz-cf-id "";
			proxy_buffering off;
			proxy_request_buffering off;
			proxy_read_timeout 300s;
		}

		location ^~ /remote/mss/ {
			aws_sign;
			internal;
			# A variable in proxy_pass makes nginx resolve the host at request time.
			# Must be set before the rewrite: "break" stops further rewrite-module directives.
			set $s3_host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			rewrite ^/remote/mss/(.*) /$1 break;
			proxy_pass http://$s3_host;
			proxy_set_header Host ${AWS_S3_BUCKET}.s3.amazonaws.com;
			proxy_set_header x-amz-cf-id "";
		}

		location /hls/ {
			vod hls;
			add_header Access-Control-Allow-Headers '*';
			add_header Access-Control-Allow-Origin '*';
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
		}

		location /dash/ {
			vod dash;
			add_header Access-Control-Allow-Headers '*';
			add_header Access-Control-Allow-Origin '*';
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
		}

		location /mss/ {
			vod mss;
			add_header Access-Control-Allow-Headers '*';
			add_header Access-Control-Allow-Origin '*';
			add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
		}
	}
}


